name: Release Glint Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_cmd: npm --workspace=@glint/desktop run package:linux
            artifact_pattern: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.blockmap
          - os: windows-latest
            target_cmd: npm --workspace=@glint/desktop run package:win
            artifact_pattern: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.blockmap
          - os: macos-latest
            target_cmd: npm --workspace=@glint/desktop run package:mac
            artifact_pattern: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo packages
        run: npm run build

      - name: Package desktop application
        run: ${{ matrix.target_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd apps/desktop/release
          for f in *.{AppImage,deb,exe,dmg,zip}; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS.txt || true
            fi
          done

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_pattern }}
            apps/desktop/release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
